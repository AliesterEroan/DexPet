<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dex</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
<div class="stage">
    <div class="mascot" id="dex" role="button" tabindex="0" aria-label="Dex — drag to move">
        <span class="mascot-bob">
            <span class="mascot-tab"></span>
            <span class="mascot-body">
                <span class="mascot-eye mascot-eye--l"></span>
                <span class="mascot-eye mascot-eye--r"></span>
                <span class="mascot-cheek mascot-cheek--l"></span>
                <span class="mascot-cheek mascot-cheek--r"></span>
                <span class="mascot-smile"></span>
            </span>
        </span>
    </div>
</div>
<script src="pet.js"></script>
</body>
</html>
